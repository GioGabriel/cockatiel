[project]
name = "vocal-coach-api"
version = "0.1.0"
description = "FastAPI backend scaffold for Vocal Coach"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
firestore = [
  "google-cloud-firestore>=2.20.0"
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
