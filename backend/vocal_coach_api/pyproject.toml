[project]
name = "vocal-coach-api"
version = "0.1.0"
description = "FastAPI backend scaffold for Vocal Coach"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0"
]

[project.optional-dependencies]
firestore = [
  "google-cloud-firestore>=2.20.0"
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pyyaml>=6.0.0",
  "ruff>=0.9.0"
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["vocal_coach_api.egg-info", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
