services:
  - type: web
    name: vocal-coach-api
    runtime: python
    region: singapore
    rootDir: backend/vocal_coach_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_BYPASS
        value: "false"
      - key: APP_ENV
        value: "production"
      - key: CORS_ALLOWED_ORIGINS
        # Set the deployed web-client origin(s) in Render. Never use localhost here.
        sync: false
      - key: CORS_ALLOW_LOCALHOST
        value: "false"
      - key: API_REQUEST_TIMEOUT_S
        value: "30"
      - key: FIRESTORE_ENABLED
        value: "true"
      - key: FIRESTORE_PROJECT_ID
        value: "cockatiel-enhanced"
      - key: AUDIO_SNIPPET_STORAGE_BACKEND
        value: "firestore"
      - key: METRICS_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_AI_ENABLED
        # Deterministic coaching remains authoritative; enable summaries only
        # when the protected Google AI Studio key list is configured.
        value: "true"
      - key: GOOGLE_API_KEYS
        sync: false
      - key: GOOGLE_AI_MODEL
        value: "gemini-2.5-flash-lite"
      - key: GOOGLE_AI_TIMEOUT_S
        value: "20"
      - key: GOOGLE_AI_MAX_TOTAL_TIME_S
        value: "20"
      - key: GOOGLE_AI_TEMPERATURE
        value: "0.2"
      - key: GOOGLE_AI_MAX_OUTPUT_TOKENS
        value: "256"
      # Used only by the explicit offline karaoke publisher. Never expose the
      # API secret to the Flutter client or normal request logs.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
