services:
  - type: web
    name: vocal-coach-api
    runtime: python
    region: singapore
    rootDir: backend/vocal_coach_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AUTH_BYPASS
        value: "false"
      - key: APP_ENV
        value: "production"
      - key: CORS_ALLOWED_ORIGINS
        # Explicit local Chrome smoke-test origins; Firebase auth is still required.
        value: "http://localhost:4173,http://127.0.0.1:4173"
      - key: CORS_ALLOW_LOCALHOST
        value: "false"
      - key: API_REQUEST_TIMEOUT_S
        value: "30"
      - key: FIRESTORE_ENABLED
        value: "true"
      - key: FIRESTORE_PROJECT_ID
        value: "cockatiel-enhanced"
      - key: METRICS_ACCESS_TOKEN
        sync: false
      - key: OPENROUTER_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEYS
        sync: false
      # Legacy deployments may continue using OPENROUTER_API_KEY; the backend
      # accepts it when the canonical plural variable is not configured.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.1-8b-instruct:free"
      - key: OPENROUTER_TIMEOUT_S
        value: "20"
      - key: OPENROUTER_MAX_TOTAL_TIME_S
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.9"
