<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cockatiel - Your Gateway to Vocal Mastery">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cockatiel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="cockatiel_logo.jpg"/>
  <title>Cockatiel</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background-color: #09090F;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── SPLASH ─────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      background: #09090F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      /* Fade out on dismiss */
      transition: opacity 0.5s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── LOGO ───────────────────────────────────────── */
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 28px;
      /* Entrance: fade in + subtle scale from 0.92 */
      animation: enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── WORDMARK ───────────────────────────────────── */
    .splash-wordmark {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      animation: enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    /* ── TAGLINE ────────────────────────────────────── */
    .splash-tagline {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.5px;
      animation: enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    /* ── SINGLE ANIMATION: fade up ──────────────────── */
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-logo">
      <img src="cockatiel_logo.jpg" alt="Cockatiel" />
    </div>
    <div class="splash-wordmark">Cockatiel</div>
    <div class="splash-tagline">Your Gateway to Vocal Mastery</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 550);
      }
    });
  </script>
</body>
</html>
